# ============================================================
# application.yml — base configuration (environment-agnostic)
# ============================================================
# Sensitive values (DB password, tokens, API keys) must be
# supplied via environment variables or a secret manager.
# Never commit secrets to source control.
# ============================================================

spring:
  application:
    name: booking-assistant

  # ─── Database ──────────────────────────────────────────────
  datasource:
    # Override with environment variable: SPRING_DATASOURCE_URL
    # Supabase example:
    #   jdbc:postgresql://<host>.supabase.co:5432/postgres?sslmode=require
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_assistant}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ─── JPA / Hibernate ───────────────────────────────────────
  jpa:
    # Use 'validate' in production — Flyway manages the schema.
    # Use 'none' if you prefer to control everything via migrations.
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ─── Flyway migrations ─────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ─── Jackson ───────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ─── Server ──────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  # Expose the real client IP when running behind a reverse proxy / load balancer
  forward-headers-strategy: native

# ─── Meta / WhatsApp ─────────────────────────────────────────
meta:
  webhook:
    # Token configured in Meta Developer Console → App → Webhooks → Verify Token.
    # Must be provided via environment variable: META_WEBHOOK_VERIFY_TOKEN
    verify-token: ${META_WEBHOOK_VERIFY_TOKEN:change_me_before_deploy}
  # Meta permanent access token (used by the Send API — future use)
  access-token: ${META_ACCESS_TOKEN:}

# ─── Logging ─────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.terminai.bookingassistant: INFO
    org.hibernate.SQL: WARN
